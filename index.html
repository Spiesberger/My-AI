<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsere Eigene KI</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
    .chat-container { width: 100%; max-width: 600px; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    #chat-box { height: 350px; overflow-y: auto; border: 1px solid #334155; padding: 10px; border-radius: 8px; margin-bottom: 10px; background: #0f172a; }
    .msg { margin: 8px 0; padding: 8px 12px; border-radius: 6px; }
    .user { background: #0284c7; text-align: right; }
    .bot { background: #334155; }
    input, button { padding: 10px; border-radius: 6px; border: none; margin-top: 5px; }
    input[type="text"] { width: 70%; background: #334155; color: white; }
    input[type="password"] { width: 95%; background: #334155; color: white; margin-bottom: 10px; }
    button { background: #10b981; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #059669; }
  </style>
</head>
<body>

<div class="chat-container">
  <h2>🤖 Unsere KI-Website</h2>
  <input type="password" id="apiKey" placeholder="Füge hier deinen Gemini API-Key ein...">
  
  <div id="chat-box"></div>

  <div style="display: flex; gap: 5px;">
    <input type="text" id="userInput" placeholder="Schreibe eine Nachricht...">
    <button onclick="sendMessage()">Senden</button>
  </div>
</div>

<script>
async function sendMessage() {
  const apiKey = document.getElementById("apiKey").value;
  const input = document.getElementById("userInput");
  const chatBox = document.getElementById("chat-box");

  if (!apiKey) { alert("Bitte gib zuerst deinen API-Key ein!"); return; }
  if (!input.value.trim()) return;

  const userText = input.value;
  chatBox.innerHTML += `<div class="msg user">${userText}</div>`;
  input.value = "";
  chatBox.scrollTop = chatBox.scrollHeight;

  // Anfrage an die KI senden
  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: userText }] }] })
    });

    const data = await response.json();
    const botReply = data.candidates[0].content.parts[0].text;
    chatBox.innerHTML += `<div class="msg bot">${botReply}</div>`;
  } catch (error) {
    chatBox.innerHTML += `<div class="msg bot" style="color: red;">Fehler: API-Key ungültig oder Verbindung fehlgeschlagen.</div>`;
  }
  chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
