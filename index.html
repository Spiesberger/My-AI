<script>
// Lädt den gespeicherten Key beim Starten der Seite
document.addEventListener("DOMContentLoaded", () => {
  const savedKey = localStorage.getItem("my_gemini_key");
  if (savedKey) {
    document.getElementById("apiKey").value = savedKey;
  }
});

async function sendMessage() {
  const apiKeyInput = document.getElementById("apiKey");
  const apiKey = apiKeyInput.value.trim();
  const input = document.getElementById("userInput");
  const chatBox = document.getElementById("chat-box");

  if (!apiKey) { 
    alert("Bitte gib zuerst deinen API-Key ein!"); 
    return; 
  }
  
  // Speichert den Key lokal in deinem Browser
  localStorage.setItem("my_gemini_key", apiKey);

  if (!input.value.trim()) return;

  const userText = input.value;
  chatBox.innerHTML += `<div class="msg user">${userText}</div>`;
  input.value = "";
  chatBox.scrollTop = chatBox.scrollHeight;

  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: userText }] }] })
    });

    const data = await response.json();
    const botReply = data.candidates[0].content.parts[0].text;
    chatBox.innerHTML += `<div class="msg bot">${botReply}</div>`;
  } catch (error) {
    chatBox.innerHTML += `<div class="msg bot" style="color: #f87171;">Fehler: API-Key ungültig oder Verbindung fehlgeschlagen.</div>`;
  }
  chatBox.scrollTop = chatBox.scrollHeight;
}
</script>
